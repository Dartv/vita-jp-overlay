; Vita JP Overlay settings. Changes apply the next time the overlay opens.

; Dictionary used for word lookups: jpdb | jiten
dictionary = jiten

; jpdb.io API key (needed for dictionary = jpdb): jpdb.io -> Settings -> API key
jpdb_api_key =

; jiten.moe API key (needed for dictionary = jiten): jiten.moe -> Settings -> API key
jiten_api_key =

; Drop OCR lines without Japanese characters: none | lines
non_japanese_filter = lines

; Text size, 8-40: Japanese (sentence, words, readings) and English (meanings, messages)
font_size_ja = 18
font_size_en = 14

; Opens/closes the overlay: a button combination, or a double tap on the rear
; touchpad (buttons are hidden from the game; rear taps are not):
; l+r | select | start | select+l | select+r | rear_double_tap
toggle_button = l+r

; auto: recognize text in the background when the region changes (instant overlay)
; on_press: recognize only when the overlay is opened
ocr_mode = auto

; Debugging: IP of a computer running tools/udp_log_listener.py (empty = off)
log_host =

; Debugging: write ux0:data/VitaJPOverlay/log.txt (max 256 KB + one rotated file): on | off
log_file = off

; ---- Anki (optional, see README) ----
; × in the overlay adds the selected word to Anki through AnkiConnect on a computer.

; The computer running Anki: empty = off, auto = search the local network,
; or its IP address (optionally with :port, default 8765)
anki_host =

; Deck (created if missing), note type, and tags separated by spaces
anki_deck = Default
anki_note_type = Lapis
anki_tags = vita-jp-overlay

anki_field_word = Expression
anki_field_reading = ExpressionReading
anki_field_furigana = ExpressionFurigana
anki_field_definition = MainDefinition
anki_field_sentence = Sentence
anki_field_picture = Picture
anki_field_frequency = FreqSort
